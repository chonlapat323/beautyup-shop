services:
  postgres:
    image: postgres:17-alpine
    container_name: beautyup-shop-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: beautyup
      POSTGRES_PASSWORD: beautyup
      POSTGRES_DB: beautyup_shop
    ports:
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
